services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"

  llm-simple-chat:
    build:
      context: ./backend
      args:
        APP: llm-simple-chat
    env_file:
      - path: .env
        required: false
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: playground
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d playground"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
