services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"

  llm-simple-chat:
    build:
      context: ./backend
      args:
        APP: llm-simple-chat
    env_file:
      - path: .env
        required: false
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    post_start:
      - command: sh -c "until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull llama3.2"
    healthcheck:
      test: [ "CMD", "ollama", "show", "llama3.2" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10m

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: playground
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d playground"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  ollama-data:
